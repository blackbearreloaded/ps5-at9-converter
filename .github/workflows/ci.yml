name: Build

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.x"]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Install numpy
        run: python -m pip install numpy

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Conversion smoke test
        run: python ps5_at9.py --input tests/data/tone-44k-stereo.mp3 --output snd0.at9 --duration max --preview preview.wav
